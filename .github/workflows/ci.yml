name: ci

on:
  push:
  pull_request:

jobs:
  # 服务端 + QQ 插件 + 全仓库 lint（规则见根 pyproject.toml）
  server:
    runs-on: ubuntu-latest
    env:
      API_TOKEN: ""
      DEPLOYMENT_ENV: test
      LLM_API_KEY: sk-test-key
      EMBEDDING_API_KEY: sk-test-key
      QQ_ADMIN_ID: ""
      QQ_PUSH_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r server/requirements.txt ruff
      - name: Run server tests
        run: python -m pytest server/tests/ -q
      - name: Run QQ plugin tests
        run: python -m pytest qq/astrbot_plugin_xy/test_main.py -q
      - name: Run ruff (repo-wide, config in pyproject.toml)
        run: ruff check .
      - name: Check JavaScript syntax
        run: |
          node --check server/app/web/static/chat.js
          node --check server/app/web/static/novel/index.js
      - name: Check shell syntax
        run: bash -n scripts/deploy_server.sh

  # 桌面端（PySide6，纯 Windows 组件）与采集器语法检查
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r desktop/requirements.txt pytest ruff
      - name: Run desktop tests
        run: python -m pytest desktop/tests/ -q
      - name: Ruff check Windows-only components
        run: python -m ruff check desktop/ collector/
