name: ci

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    env:
      API_TOKEN: ""
      DEPLOYMENT_ENV: test
      LLM_API_KEY: sk-test-key
      EMBEDDING_API_KEY: sk-test-key
      QQ_ADMIN_ID: ""
      QQ_PUSH_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r server/requirements.txt ruff
      - name: Run server tests
        run: python -m pytest server/tests/ -q
      - name: Run ruff
        # 仓库现有测试通过 sys.path 注入后导入，E402/E731 为既有兼容写法；
        # 其余语法、未定义名称和运行时错误仍作为发布门禁。
        run: ruff check --select E4,E7,E9,F --ignore E402,E731 server/app/ server/tests/
      - name: Check JavaScript syntax
        run: |
          node --check server/app/web/static/chat.js
          node --check server/app/web/static/novel/index.js
      - name: Check shell syntax
        run: bash -n scripts/deploy_server.sh
