<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal AI Assistant</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #0f1115; color: #e8e8e8; }
    .app { display: flex; height: 100vh; }
    .sidebar { width: 260px; border-right: 1px solid #222; padding: 16px; }
    .sidebar h1 { font-size: 16px; }
    .sidebar a { display: block; padding: 8px; color: #aaa; text-decoration: none; border-radius: 6px; }
    .sidebar a.active, .sidebar a:hover { background: #1c1f26; color: #fff; }
    .main { flex: 1; display: flex; flex-direction: column; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; }
    .msg { max-width: 70%; margin: 8px 0; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; }
    .user { margin-left: auto; background: #2b5cff; }
    .assistant { background: #1c1f26; }
    .inputbar { display: flex; gap: 8px; padding: 16px; border-top: 1px solid #222; }
    .tokenbar { display: flex; gap: 8px; padding: 6px 16px; border-top: 1px solid #222; }
    #input { flex: 1; background: #1c1f26; color: #eee; border: 1px solid #333; border-radius: 8px; padding: 10px; }
    #token { flex: 1; background: #1c1f26; color: #eee; border: 1px solid #333; border-radius: 8px; padding: 6px; font-size: 12px; }
    button { background: #2b5cff; color: #fff; border: none; border-radius: 8px; padding: 0 20px; cursor: pointer; }
    .hint { color: #666; font-size: 12px; text-align: center; padding: 4px; }
    .panel { display: none; flex: 1; overflow: auto; padding: 20px; }
    .panel.active { display: block; }
    .toolbar, .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .card { background: #1c1f26; border: 1px solid #333; border-radius: 8px; padding: 12px; margin: 8px 0; }
    .card button { padding: 6px 10px; }
    select, .panel input { background: #1c1f26; color: #eee; border: 1px solid #333; border-radius: 6px; padding: 7px; }
    .muted { color: #999; font-size: 12px; }
  </style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <h1>🤖 Personal AI Assistant</h1>
    <a href="/" class="active">💬 聊天</a>
    <a href="#" onclick="showStats()">📊 行为统计</a>
    <a href="#" onclick="showReports()">📋 周报</a>
    <a href="#" onclick="showNovel()">📚 小说工作台</a>
  </div>
  <div class="main">
    <div id="chat">
      <div class="msg assistant">你好，我是你的个人助手。我可以记住我们的对话、记录你的工作日志，每周生成学习反思。试试说"记录：下午2-5点调RAG性能"。</div>
    </div>
    <section id="novel-panel" class="panel">
      <h2>小说工作台</h2>
      <div class="toolbar"><select id="novel-project"></select><button onclick="loadNovel()">刷新</button><button onclick="rebuildNovelIndex()">重建索引</button></div>
      <div id="novel-status" class="muted"></div>
      <div class="row"><input id="novel-query" placeholder="搜索章节全文"><button onclick="searchNovel()">搜索</button></div>
      <div id="novel-chapters"></div><div id="novel-jobs"></div>
    </section>
    <div class="hint" id="hint"></div>
    <div class="tokenbar">
      <input id="token" type="password" placeholder="API Token（服务器 .env 里的 API_TOKEN）" autocomplete="off">
      <button onclick="saveToken()">保存</button>
    </div>
    <div class="inputbar">
      <input id="input" placeholder="说点什么…" autocomplete="off">
      <button onclick="send()">发送</button>
    </div>
  </div>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const hint = document.getElementById('hint');
const tokenInput = document.getElementById('token');

// Token 存 localStorage（浏览器本地），每次请求带上
tokenInput.value = localStorage.getItem('api_token') || '';
function saveToken() {
  localStorage.setItem('api_token', tokenInput.value.trim());
  hint.textContent = 'Token 已保存';
}
function authHeaders() {
  const t = localStorage.getItem('api_token') || '';
  return t ? {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t}
           : {'Content-Type': 'application/json'};
}

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  addMsg('user', msg);
  hint.textContent = '思考中…';
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({message: msg})
    });
    if (r.status === 401) {
      addMsg('assistant', '未授权：请在上方填入 API Token 并保存');
      hint.textContent = '';
      return;
    }
    const data = await r.json();
    addMsg('assistant', data.reply);
    hint.textContent = data.memories_used > 0 ? `召回了 ${data.memories_used} 条记忆` : '';
  } catch (e) {
    addMsg('assistant', '连接失败：' + e.message);
    hint.textContent = '';
  }
}

input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

async function showStats() {
  const r = await fetch('/api/stats/summary?days=7', {headers: authHeaders()});
  const d = await r.json();
  addMsg('assistant', '📊 近7天统计：\n' +
    `对话 ${d.messages} 条，git 提交 ${d.git_commits} 次，工作日志 ${d.work_logs} 条\n\n` +
    '应用时长 Top：\n' + (d.top_apps.map(a => `· ${a.name}: ${a.hours}h`).join('\n') || '暂无数据'));
}

async function showReports() {
  const r = await fetch('/api/reports', {headers: authHeaders()});
  const d = await r.json();
  if (!d.reports.length) { addMsg('assistant', '暂无周报，可稍后查看。'); return; }
  const wk = d.reports[0].week;
  const rr = await fetch('/api/reports/' + wk, {headers: authHeaders()});
  const rd = await rr.json();
  addMsg('assistant', `📋 周报 ${wk}：\n` + rd.content);
}

function showNovel() {
  document.getElementById('chat').style.display = 'none';
  document.querySelector('.inputbar').style.display = 'none';
  document.getElementById('novel-panel').classList.add('active');
  loadNovel();
}
async function loadNovel() {
  const panel = document.getElementById('novel-panel');
  panel.classList.add('active');
  const r = await fetch('/api/novel/projects', {headers: authHeaders()});
  if (!r.ok) { document.getElementById('novel-status').textContent = '项目加载失败'; return; }
  const d = await r.json();
  const select = document.getElementById('novel-project');
  select.innerHTML = d.projects.map(p => `<option value="${p.project_id}">${p.name}</option>`).join('');
  if (select.value) await loadNovelDetails(select.value);
  select.onchange = () => loadNovelDetails(select.value);
}
async function loadNovelDetails(projectId) {
  const [cr, jr, ir] = await Promise.all([
    fetch(`/api/novel/projects/${projectId}/chapters`, {headers: authHeaders()}),
    fetch(`/api/novel/projects/${projectId}/jobs`, {headers: authHeaders()}),
    fetch(`/api/novel/projects/${projectId}/index/status`, {headers: authHeaders()})
  ]);
  const chapters = await cr.json(), jobs = await jr.json(), index = await ir.json();
  document.getElementById('novel-status').textContent = `章节 ${chapters.chapters.length} · 文件索引 ${index.files.files} 个`;
  document.getElementById('novel-chapters').innerHTML = '<h3>章节</h3>' + chapters.chapters.map(c => `<div class="card"><b>第${c.chapter_no}章 ${c.title || ''}</b><div class="muted">${(c.content || '').slice(0, 160)}</div></div>`).join('');
  document.getElementById('novel-jobs').innerHTML = '<h3>生成任务</h3>' + jobs.jobs.map(j => `<div class="card"><b>${j.status}</b> · ${j.progress}% · 尝试 ${j.attempts}<div class="muted">${j.error || ''}</div><button onclick="jobAction('${projectId}','${j.job_id}','cancel')">取消</button><button onclick="jobAction('${projectId}','${j.job_id}','retry')">重试</button></div>`).join('');
}
async function jobAction(projectId, jobId, action) {
  const r = await fetch(`/api/novel/projects/${projectId}/jobs/${jobId}/${action}`, {method: 'POST', headers: authHeaders()});
  hint.textContent = r.ok ? '任务已更新' : '任务操作失败';
  await loadNovelDetails(projectId);
}
async function searchNovel() {
  const projectId = document.getElementById('novel-project').value;
  const q = encodeURIComponent(document.getElementById('novel-query').value.trim());
  if (!projectId || !q) return;
  const r = await fetch(`/api/novel/projects/${projectId}/chapters/search?q=${q}`, {headers: authHeaders()});
  const d = await r.json();
  document.getElementById('novel-chapters').innerHTML = '<h3>搜索结果</h3>' + d.results.map(x => `<div class="card"><b>第${x.chapter_no}章 ${x.title || ''}</b><div>${x.snippet || ''}</div></div>`).join('');
}
async function rebuildNovelIndex() {
  const projectId = document.getElementById('novel-project').value;
  const r = await fetch(`/api/novel/projects/${projectId}/index/rebuild`, {method: 'POST', headers: authHeaders()});
  hint.textContent = r.ok ? '索引已重建' : '索引重建失败';
  await loadNovelDetails(projectId);
}
</script>
</body>
</html>
