<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal AI Assistant</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #0f1115; color: #e8e8e8; }
    .app { display: flex; height: 100vh; }
    .sidebar { width: 260px; border-right: 1px solid #222; padding: 16px; }
    .sidebar h1 { font-size: 16px; }
    .sidebar a { display: block; padding: 8px; color: #aaa; text-decoration: none; border-radius: 6px; }
    .sidebar a.active, .sidebar a:hover { background: #1c1f26; color: #fff; }
    .main { flex: 1; display: flex; flex-direction: column; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; }
    .msg { max-width: 70%; margin: 8px 0; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; }
    .user { margin-left: auto; background: #2b5cff; }
    .assistant { background: #1c1f26; }
    .inputbar { display: flex; gap: 8px; padding: 16px; border-top: 1px solid #222; }
    .tokenbar { display: flex; gap: 8px; padding: 6px 16px; border-top: 1px solid #222; }
    #input { flex: 1; background: #1c1f26; color: #eee; border: 1px solid #333; border-radius: 8px; padding: 10px; }
    #token { flex: 1; background: #1c1f26; color: #eee; border: 1px solid #333; border-radius: 8px; padding: 6px; font-size: 12px; }
    button { background: #2b5cff; color: #fff; border: none; border-radius: 8px; padding: 0 20px; cursor: pointer; }
    .hint { color: #666; font-size: 12px; text-align: center; padding: 4px; }
  </style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <h1>🤖 Personal AI Assistant</h1>
    <a href="/" class="active">💬 聊天</a>
    <a href="#" onclick="showStats()">📊 行为统计</a>
    <a href="#" onclick="showReports()">📋 周报</a>
  </div>
  <div class="main">
    <div id="chat">
      <div class="msg assistant">你好，我是你的个人助手。我可以记住我们的对话、记录你的工作日志，每周生成学习反思。试试说"记录：下午2-5点调RAG性能"。</div>
    </div>
    <div class="hint" id="hint"></div>
    <div class="tokenbar">
      <input id="token" type="password" placeholder="API Token（服务器 .env 里的 API_TOKEN）" autocomplete="off">
      <button onclick="saveToken()">保存</button>
    </div>
    <div class="inputbar">
      <input id="input" placeholder="说点什么…" autocomplete="off">
      <button onclick="send()">发送</button>
    </div>
  </div>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const hint = document.getElementById('hint');
const tokenInput = document.getElementById('token');

// Token 存 localStorage（浏览器本地），每次请求带上
tokenInput.value = localStorage.getItem('api_token') || '';
function saveToken() {
  localStorage.setItem('api_token', tokenInput.value.trim());
  hint.textContent = 'Token 已保存';
}
function authHeaders() {
  const t = localStorage.getItem('api_token') || '';
  return t ? {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t}
           : {'Content-Type': 'application/json'};
}

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  addMsg('user', msg);
  hint.textContent = '思考中…';
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({message: msg})
    });
    if (r.status === 401) {
      addMsg('assistant', '未授权：请在上方填入 API Token 并保存');
      hint.textContent = '';
      return;
    }
    const data = await r.json();
    addMsg('assistant', data.reply);
    hint.textContent = data.memories_used > 0 ? `召回了 ${data.memories_used} 条记忆` : '';
  } catch (e) {
    addMsg('assistant', '连接失败：' + e.message);
    hint.textContent = '';
  }
}

input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

async function showStats() {
  const r = await fetch('/api/stats/summary?days=7', {headers: authHeaders()});
  const d = await r.json();
  addMsg('assistant', '📊 近7天统计：\n' +
    `对话 ${d.messages} 条，git 提交 ${d.git_commits} 次，工作日志 ${d.work_logs} 条\n\n` +
    '应用时长 Top：\n' + (d.top_apps.map(a => `· ${a.name}: ${a.hours}h`).join('\n') || '暂无数据'));
}

async function showReports() {
  const r = await fetch('/api/reports', {headers: authHeaders()});
  const d = await r.json();
  if (!d.reports.length) { addMsg('assistant', '暂无周报，可稍后查看。'); return; }
  const wk = d.reports[0].week;
  const rr = await fetch('/api/reports/' + wk, {headers: authHeaders()});
  const rd = await rr.json();
  addMsg('assistant', `📋 周报 ${wk}：\n` + rd.content);
}
</script>
</body>
</html>
