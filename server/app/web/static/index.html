<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal AI Assistant</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .app { display: flex; height: 100vh; }
    .sidebar { width: 240px; border-right: 1px solid var(--border); padding: 16px; background: var(--surface); }
    .sidebar h1 { font-size: 15px; margin: 0 0 16px; }
    .sidebar a { display: flex; gap: 8px; padding: 9px 12px; color: var(--text-dim); text-decoration: none; border-radius: 8px; margin-bottom: 2px; }
    .sidebar a:hover { background: var(--surface-2); color: var(--text); }
    .sidebar a.active { background: var(--accent-weak); color: var(--accent); }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #chat { flex: 1; overflow-y: auto; padding: 24px; }
    .msg { max-width: 68%; margin: 10px 0; padding: 10px 16px; border-radius: 14px; white-space: pre-wrap; line-height: 1.7; }
    .msg.user { margin-left: auto; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .msg.assistant { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .inputbar { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); background: var(--surface); }
    .tokenbar { display: flex; gap: 8px; padding: 10px 20px; border-top: 1px solid var(--border); align-items: center; background: var(--surface); }
    #input { flex: 1; }
    #token { flex: 1; font-size: 12px; }
    #send { min-width: 72px; }
    .hint { color: var(--text-dim); font-size: 12px; text-align: center; padding: 4px; min-height: 20px; }
  </style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <h1>🤖 Personal AI Assistant</h1>
    <a href="/" class="active">💬 聊天</a>
    <a href="#" id="nav-stats">📊 行为统计</a>
    <a href="#" id="nav-reports">📋 周报</a>
    <a href="/novel/">📖 小说工作台</a>
  </nav>
  <div class="main">
    <div id="chat">
      <div class="msg assistant">你好，我是你的个人助手。我可以记住我们的对话、记录你的工作日志，每周生成学习反思。试试说"记录：下午2-5点调RAG性能"。</div>
    </div>
    <div class="hint" id="hint"></div>
    <div class="tokenbar">
      <input id="token" type="password" placeholder="API Token（服务器 .env 里的 API_TOKEN）" autocomplete="off">
      <button id="save-token">保存</button>
    </div>
    <div class="inputbar">
      <input id="input" placeholder="说点什么…" autocomplete="off" autofocus>
      <button id="send" class="primary">发送</button>
    </div>
  </div>
</div>
<script src="/app.js"></script>
<script src="/chat.js"></script>
<script>
  document.getElementById('nav-stats').addEventListener('click', (e) => { e.preventDefault(); showStats(); });
  document.getElementById('nav-reports').addEventListener('click', (e) => { e.preventDefault(); showReports(); });
</script>
</body>
</html>
