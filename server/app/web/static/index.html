<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人 AI 助手</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🤖%3C/text%3E%3C/svg%3E">
  <!-- 主题预应用：在首帧渲染前设置 data-theme，避免暗色用户白屏闪烁 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('ui_theme');
        var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* localStorage 不可用时走默认亮色 */ }
    })();
  </script>
  <link rel="stylesheet" href="/styles.css?v=3">
</head>
<body>
<div class="chat-app">
  <nav class="chat-side">
    <h1>🤖 个人 AI 助手</h1>
    <div class="chat-nav">
      <a href="/" class="active">💬 聊天</a>
      <a href="#" id="nav-stats">📊 行为统计</a>
      <a href="#" id="nav-reports">📋 周报</a>
      <a href="/novel/">📖 小说工作台</a>
    </div>
    <div class="chat-side-foot">
      <button id="theme-btn" class="ghost" title="切换主题" aria-label="切换主题">🌗</button>
      <button id="token-btn" class="ghost" title="API Token 设置" aria-label="API Token 设置">🔑</button>
    </div>
  </nav>
  <div class="chat-main">
    <div id="chat" aria-live="polite">
      <div class="msg assistant">你好，我是你的个人助手。我可以记住我们的对话、记录你的工作日志，每周生成学习反思。试试说"记录：下午2-5点调RAG性能"。</div>
    </div>
    <div class="hint" id="hint"></div>
    <div class="inputbar">
      <input id="input" placeholder="说点什么…" autocomplete="off" autofocus aria-label="消息输入">
      <button id="send" class="primary">发送</button>
    </div>
  </div>
</div>

<!-- Token 设置弹层 -->
<div id="token-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="token-modal-title">
  <div class="modal-box card">
    <h3 id="token-modal-title">API Token</h3>
    <p class="muted">Token 存于浏览器本地，用于访问服务端 API。</p>
    <input id="token-input" type="password" placeholder="粘贴服务器 .env 里的 API_TOKEN" autocomplete="off" aria-label="API Token">
    <div class="modal-actions">
      <button id="token-cancel" class="small">取消</button>
      <button id="token-save" class="primary small">保存</button>
    </div>
  </div>
</div>

<!-- 统计 / 周报抽屉 -->
<div id="drawer-mask" class="drawer-mask hidden"></div>
<aside id="drawer" class="drawer hidden" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
  <div class="drawer-head">
    <h3 id="drawer-title"></h3>
    <div class="drawer-actions">
      <button id="drawer-close" class="ghost" aria-label="关闭">✕</button>
    </div>
  </div>
  <div id="drawer-body" class="drawer-body drawer-text"></div>
</aside>

<script src="/app.js?v=4"></script>
<script src="/chat.js?v=4"></script>
</body>
</html>
